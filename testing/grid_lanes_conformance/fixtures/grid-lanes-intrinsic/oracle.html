<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 420px; height: 380px; } * { box-sizing: border-box; }
  .page { display: flex; flex-direction: column; width: 420px; height: 380px; padding: 20px; }
  .lanes { display: grid-lanes; width: 380px; grid-template-columns: min-content fit-content(110px) minmax(80px, 1fr); column-gap: 10px; row-gap: 12px; }
  .item { width: 80px; min-width: 0; min-height: 0; }
  .item1 { height: 54px; } .item2 { height: 86px; } .item3 { height: 46px; }
  .item4 { height: 74px; } .item5 { height: 62px; } .item6 { height: 94px; }
</style>
<div class="page" data-test-tag="page"><div class="lanes" data-test-tag="lanes">
  <div class="item item1" data-test-tag="item1"></div><div class="item item2" data-test-tag="item2"></div><div class="item item3" data-test-tag="item3"></div>
  <div class="item item4" data-test-tag="item4"></div><div class="item item5" data-test-tag="item5"></div><div class="item item6" data-test-tag="item6"></div>
</div></div>
