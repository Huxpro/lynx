<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 600px; height: 320px; } * { box-sizing: border-box; }
  .page { display: flex; flex-direction: column; width: 600px; height: 320px; padding: 20px; }
  .lanes { display: grid-lanes; width: 560px; height: 104px; grid-template-columns: repeat(auto-fit, 100px); column-gap: 10px; row-gap: 12px; }
  .item { min-width: 0; min-height: 0; }
  .item1 { height: 72px; } .item2 { height: 104px; }
</style>
<div class="page" data-test-tag="page"><div class="lanes" data-test-tag="lanes">
  <div class="item item1" data-test-tag="item1"></div><div class="item item2" data-test-tag="item2"></div>
</div></div>
