<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 380px; height: 420px; } * { box-sizing: border-box; }
  .page { display: flex; flex-direction: column; width: 380px; height: 420px; padding: 20px; }
  .lanes { display: grid-lanes; width: 340px; grid-template-columns: repeat(3, 100px); column-gap: 20px; row-gap: 10px; flow-tolerance: 0; }
  .item { min-width: 0; min-height: 0; }
  .last { height: 60px; grid-column-start: -2; }
  .spanning { height: 40px; grid-column: -3 / -1; }
  .automatic { height: 30px; }
</style>
<div class="page" data-test-tag="page"><div class="lanes" data-test-tag="lanes">
  <div class="item last" data-test-tag="last"></div>
  <div class="item spanning" data-test-tag="spanning"></div>
  <div class="item automatic" data-test-tag="automatic"></div>
</div></div>
