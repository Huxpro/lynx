<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 380px; height: 420px; } * { box-sizing: border-box; }
  .page { display: flex; flex-direction: column; width: 380px; height: 420px; padding: 20px; }
  .lanes { display: grid-lanes; width: 340px; grid-template-columns: repeat(3, 100px); column-gap: 20px; row-gap: 10px; grid-auto-flow: dense; flow-tolerance: 0; }
  .item { min-width: 0; min-height: 0; }
  .first { height: 100px; } .second { height: 30px; }
  .spanning { height: 60px; grid-column: span 2; }
  .candidate { height: 20px; }
</style>
<div class="page" data-test-tag="page"><div class="lanes" data-test-tag="lanes">
  <div class="item first" data-test-tag="first"></div>
  <div class="item second" data-test-tag="second"></div>
  <div class="item spanning" data-test-tag="spanning"></div>
  <div class="item candidate" data-test-tag="candidate"></div>
</div></div>
