<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 300px; height: 300px; } * { box-sizing: border-box; }
  .page { display: flex; flex-direction: column; width: 300px; height: 300px; padding: 20px; }
  .lanes { position: relative; display: grid-lanes; width: 260px; grid-template-rows: repeat(2, 50px); column-gap: 10px; row-gap: 20px; flow-tolerance: 0; }
  .item { height: 20px; min-width: 0; min-height: 0; }
  .first { width: 60px; } .second { width: 80px; }
  .explicit { width: 40px; grid-row-start: 2; }
  .absolute { position: absolute; width: 30px; height: 20px; grid-row: 2 / 3; grid-column: 1 / 2; }
</style>
<div class="page" data-test-tag="page"><div class="lanes" data-test-tag="lanes">
  <div class="item first" data-test-tag="first"></div>
  <div class="item second" data-test-tag="second"></div>
  <div class="item explicit" data-test-tag="explicit"></div>
  <div class="absolute" data-test-tag="absolute"></div>
</div></div>
