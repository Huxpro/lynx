<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 260px; height: 360px; } * { box-sizing: border-box; }
  .page { display: flex; flex-direction: column; width: 260px; height: 360px; padding: 20px; }
  .lanes { display: grid-lanes; width: 220px; height: 300px; grid-template-columns: repeat(2, 100px); column-gap: 20px; row-gap: 10px; align-content: center; flow-tolerance: 0; }
  .item { width: 60px; min-width: 0; min-height: 0; }
  .first { height: 40px; margin-left: auto; margin-right: auto; align-self: end; }
  .second { height: 100px; }
  .spanning { width: 220px; height: 20px; grid-column: span 2; }
</style>
<div class="page" data-test-tag="page"><div class="lanes" data-test-tag="lanes">
  <div class="item first" data-test-tag="first"></div>
  <div class="item second" data-test-tag="second"></div>
  <div class="item spanning" data-test-tag="spanning"></div>
</div></div>
